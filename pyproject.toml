[project]
name = "hiring-confinqa"
version = "0.1.0"
description = "ConfinQA assignment data processing and assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7",
  "python-dotenv>=1.0.0",
  "pandas>=2.2.0",
  "pydantic>=2.10.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
  "requests>=2.32.0",
  # LangChain ecosystem - use compatible versions
  "langchain>=1.4.0,<1.5.0",
  "langchain-core>=1.7.0,<1.8.0",
  "langgraph>=1.2.0,<1.3.0",
  "langchain-groq>=1.1.0,<1.2.0",
  "langchain-nvidia-ai-endpoints>=1.5.0,<1.6.0",
  "langchain-huggingface>=0.1.0",
  "langchain-experimental>=0.3.0",
  # Docling + HF stack - pin to compatible versions
  "docling>=2.15.0",
  "huggingface-hub>=1.20.0,<2.0.0",
  "transformers>=4.45.0",
  "sentence-transformers>=5.0.0,<6.0.0",
  "tokenizers>=0.20.0",
  "safetensors>=0.5.0",
  # Google Document AI
  "google-cloud-documentai>=2.25.0",
  "google-cloud-storage>=2.10.0",
  # Gradio - use 5.x which fixes the schema bug but works with HF 1.x
  "gradio>=5.0.0,<6.0.0",
  "gradio-client>=1.3.0,<2.0.0",
  # Other
  "joblib>=1.5.0",
  "typer>=0.19.0",
  "rich>=14.0.0",
  "numpy>=2.0.0,<3.0.0",
  "ipykernel>=6.30.0",
  "ipywidgets>=8.1.0",
  "weaviate-client>=4.18.3",
  "fastapi>=0.119.0",
  "uvicorn>=0.37.0",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.4.1.post1",
]

# Optional dependencies for testing
[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.5.0",
  "faker>=24.0.0",
  "httpx>=0.27.0",  # for testing async HTTP clients
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
main = "src.main:app"


[tool.ruff]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "F",  # default Ruff rules
    "E",  # pycodestyle Errors
    "W",  # pycodestyle Warnings
    "I",  # import sorting
    "UP", # modern syntax updates
    "B",  # flake8 common pitfalls & best practices
    "Q",  # flake8 consistent quotes
    "N",  # naming conventions,
]

ignore = [
    "B008",
    "D413",
    "E501",
    "W293",
    "W291",
    "PLR2004",
    "D101",
    "D400",

]

fixable = ["ALL"]

extend-select = [
    "PLR2004",
    "D101",
    "D102",
    "D103",
    "D201",
    "D202",
    "D215",
    "T201",
]

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_globals = true
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_return_any = true
plugins = ['pydantic.mypy']
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/test_*.py",
    "*/conftest.py",
    ".venv/*",
    "*/migrations/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2

[tool.uv.sources]
weaviate-client = { path = "/Users/rezamohajerpoor/Documents/Documents/Github/FinQA_Agentic_workflow/finqa_app/latest" }
